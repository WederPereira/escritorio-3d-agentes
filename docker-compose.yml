# Computador virtual do escritório: um Linux (Ubuntu + XFCE) com área de trabalho que abre no navegador.
# Só responde neste computador (127.0.0.1). Os arquivos do PC ficam em pcs/pc1.
# Para mais PCs, copie o bloco pc1 trocando nome, porta (3002, 3003...) e pasta, e acrescente em VMS no escritorio-3d.html.
services:
  pc1:
    image: linuxserver/webtop:ubuntu-xfce   # mesma imagem do lscr.io, pelo Docker Hub (o lscr.io travou aqui)
    container_name: escritorio-pc1
    hostname: pc1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - TITLE=PC 1
    shm_size: "1gb"
    mem_limit: 3g
    security_opt:
      - seccomp:unconfined
    ports: ["127.0.0.1:3001:3000"]
    volumes: ["./pcs/pc1:/config"]
    restart: unless-stopped

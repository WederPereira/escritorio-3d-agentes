<!doctype html>
<!-- Player do YouTube para a TV do escritório. A página de assistir do YouTube não abre dentro das telas
     e o player só aceita ser aberto por outro site (senão dá erro 153), então a TV passa por aqui. -->
<meta charset="utf-8">
<title>YouTube</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
<iframe id="p" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const id = (q.get('v') || '').match(/^[\w-]{11}$/);
  const list = (q.get('list') || '').match(/^[\w-]+$/);
  const p = document.getElementById('p');
  if (id) p.src = `https://www.youtube.com/embed/${id[0]}?autoplay=1&rel=1&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}` + (list ? `&list=${list[0]}` : '');
  // volume pela distância: o escritório manda o volume e ele é repassado ao player do YouTube
  let vol = null;
  const yt = (func, args = []) => p.contentWindow && p.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), 'https://www.youtube.com');
  const applyVol = () => { if (vol == null) return; p.contentWindow && p.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), 'https://www.youtube.com'); yt('setVolume', [Math.round(vol * 100)]); };
  addEventListener('message', e => {
    // o player do YouTube conta quando toca ou pausa: repassa ao escritório (mesa de som e alto-falante na guia)
    if (e.origin === 'https://www.youtube.com') {
      let d = null; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) {}
      const st = d && d.info && d.info.playerState;
      // o título do vídeo vira o título da guia (assim os agentes sabem o que está passando na TV)
      const titulo = d && d.info && d.info.videoData && d.info.videoData.title;
      if (titulo && document.title !== titulo) document.title = titulo;
      if (typeof st === 'number' && parent !== window) parent.postMessage({ esc: 'tela', tocando: st === 1 }, location.origin);
      return;
    }
    if (e.origin !== location.origin || !e.data || e.data.esc !== 'cmd') return;
    if (e.data.cmd === 'pause') yt('pauseVideo');
    if (e.data.cmd !== 'volume') return;
    vol = Math.max(0, Math.min(1, +e.data.v || 0)); applyVol();
  });
  // pede ao player para contar quando toca ou pausa (e aplica o volume, se o escritório já mandou um)
  p.addEventListener('load', () => { p.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), 'https://www.youtube.com'); applyVol(); });
  setInterval(applyVol, 2000);
</script>
